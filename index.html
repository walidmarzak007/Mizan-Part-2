    <!DOCTYPE html>
    <html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
        <title>Mizan</title>
    </head>
    <body>
        <header>
            <h1>Mizan</h1>
            <p>Gestion du catalogue de la bijouterie Al Andalous</p>
        </header>
        <main>

            <input type="text" id="search-input" placeholder="Rechercher un article...">

            <select id="status-filter">
            <option value="">Tous les statuts</option>
            <option value="available">Disponible</option>
            <option value="reserved">Réservé</option>
            <option value="sold">Vendu</option>
            </select>

            <select id="sort-select">
            <option value="">Trier par...</option>
            <option value="title">Titre</option>
            <option value="price">Prix</option>
            <option value="date">Date</option>
            </select>


            <section class="catalogue-container" id="catalogue-container">
            <p>Chargement du catalogue...</p>
             </section>

             <dialog id="article-details-dialog">
            <h2>Détails de l'article</h2>

            <div id="article-details-content"></div>

            <button type="button" id="close-details-button">
                               Fermer
             </button>
             </dialog>
            
            <button id="refresh-button">Rafraîchir le catalogue</button>
            <p id="status-message">Catalogue Prêt</p>
        </main>

        <footer>© 2026 Mizan - Tous droits réservés</footer>

            <script src="js/main.js" type="module"></script>

    </body>
    </html>
